<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A study in order and interaction. Move through a living geometric grid.">
  <title>GRID SHIFT. — Interactive Grid Study</title>
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=3">
  <meta name="apple-mobile-web-app-title" content="GRID SHIFT">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/icons/favicon-16.png?v=3">
  <link rel="stylesheet" href="scss/style.css?v=range-visual-2">
  <script defer src="assets/vendor/gsap-3.12.5.min.js"></script>
  <script defer src="js/app.js?v=range-visual-2"></script>
</head>
<body>
  <header class="header">
    <h1 class="logo">GRID SHIFT<span>.</span></h1>
    <p class="edition">COPYRIGHT ⓒ 2026 UNI</p>
  </header>
  <main class="playground" aria-label="Interactive geometric grid. Move your pointer or drag to explore.">
    <div class="tiles" aria-hidden="true"></div>
  </main>
  <footer class="footer">
    <div class="guide"><p class="caption">MOVE TO REARRANGE.</p><button class="reset" type="button" aria-label="Reset grid"><img class="reset-icon" src="assets/icons/refresh.svg" alt="" width="18" height="18">Reset</button></div>
    <section class="controls" aria-label="Grid controls">
      <div class="field type-mode" role="group" aria-labelledby="mode-label"><span class="label" id="mode-label">01 / MODE</span><div class="options"><button type="button" data-mode="swap" aria-pressed="true">Swap</button><button type="button" data-mode="cascade" aria-pressed="false">Cascade</button><button type="button" data-mode="weave" aria-pressed="false">Weave</button></div></div>
      <div class="field type-range"><label for="intensity">02 / INTENSITY <output id="intensity-value" for="intensity">60%</output></label><div class="range-control"><input id="intensity" type="range" min="0" max="100" value="60"><span class="range-visual" aria-hidden="true"></span></div></div>
      <div class="field type-range"><label for="radius">03 / RADIUS <output id="radius-value" for="radius">6칸</output></label><div class="range-control"><input id="radius" type="range" min="4" max="10" step="1" value="6"><span class="range-visual" aria-hidden="true"></span></div></div>
      <div class="field type-range"><label for="width">04 / WIDTH <output id="width-value" for="width">100%</output></label><div class="range-control"><input id="width" type="range" min="50" max="200" step="10" value="100"><span class="range-visual" aria-hidden="true"></span></div></div>
      <div class="field type-range"><label for="height">05 / HEIGHT <output id="height-value" for="height">100%</output></label><div class="range-control"><input id="height" type="range" min="50" max="200" step="10" value="100"><span class="range-visual" aria-hidden="true"></span></div></div>
    </section>
  </footer>
  <p class="status" role="status" hidden></p>
</body>
</html>
